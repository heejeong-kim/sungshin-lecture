<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>취업 말고 커리어 · AI 시대, 테크 업계에서 커리어 시작하기</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --violet:#7C3AED;          /* primary */
  --violet-600:#7C3AED;
  --violet-500:#8B5CF6;
  --violet-700:#6D28D9;
  --violet-800:#5B21B6;
  --violet-50:#F6F4FF;
  --violet-100:#EDE9FE;
  --violet-line:#E4DBFA;
  --ink:#1C1830;
  --ink-2:#3A3550;
  --muted:#8A84A0;
  --muted-2:#B4AEC6;
  --paper:#FFFFFF;
  --paper-2:#FBFAFF;
  --card:#FFFFFF;
  --card-soft:#F7F5FD;
  --shadow:0 18px 48px -20px rgba(76,29,149,.28), 0 6px 18px -10px rgba(76,29,149,.18);
  --shadow-sm:0 10px 26px -16px rgba(76,29,149,.30);

  --DW:1280px;               /* design width  */
  --DH:905px;                /* design height (≈842:595) */
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',Roboto,'Noto Sans KR',sans-serif;
  background:var(--paper);
  color:var(--ink);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* ---------- animated purple line background ---------- */
#bg-lines{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}

/* ---------- stage / scaling ---------- */
.stage{position:fixed;inset:0;z-index:1;overflow:hidden}
.deck{
  width:var(--DW);height:var(--DH);position:absolute;top:50%;left:50%;
  transform-origin:center center;
}

/* ---------- slide base ---------- */
.slide{
  position:absolute;inset:0;
  padding:52px 78px 40px;
  display:flex;flex-direction:column;
  opacity:0;transform:translateX(46px) scale(.995);
  transition:opacity .5s ease, transform .55s cubic-bezier(.22,.61,.36,1);
  pointer-events:none;
}
.slide.is-active{opacity:1;transform:none;pointer-events:auto;z-index:2}
.slide.is-leaving-left{opacity:0;transform:translateX(-46px) scale(.995);z-index:1}

/* entrance stagger for content elements — triggered by a .reveal ancestor */
[data-anim]{opacity:0;transform:translateY(26px);
  transition:opacity .6s cubic-bezier(.22,.61,.36,1), transform .6s cubic-bezier(.22,.61,.36,1);}
.reveal [data-anim],[data-anim].reveal{opacity:1;transform:none;
  transition-delay:calc(var(--i,0)*68ms + 100ms);}

/* ---- click-through fragments (head → body → insight) ---- */
.frag{opacity:0;transition:opacity .5s ease}
.frag.is-shown{opacity:1}
/* body "spread" reveal */
.frag-body{transform:scale(.9);filter:blur(12px);transform-origin:center center;
  transition:opacity .55s ease, transform .75s cubic-bezier(.16,.74,.24,1), filter .6s ease}
.frag-body.is-shown{transform:none;filter:blur(0)}
/* insight typographic reveal, word by word */
.insight.typo .word{display:inline-block;opacity:0;transform:translateY(20px) rotate(3deg);
  transition:opacity .5s ease, transform .6s cubic-bezier(.2,.7,.2,1)}
.frag-insight.is-shown .insight.typo .word{opacity:1;transform:none;
  transition-delay:calc(var(--wi,0)*55ms)}

/* ---------- slide header ---------- */
.kicker{font-size:19px;font-weight:800;letter-spacing:.14em;color:var(--violet);
  text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.kicker::before{content:"";width:34px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--violet),var(--violet-500))}
.s-emoji{font-size:40px;line-height:1;margin-bottom:8px}
.s-title{font-size:41px;font-weight:800;line-height:1.24;letter-spacing:-.02em;color:var(--ink);
  word-break:keep-all}
.s-title .hl{color:var(--violet-700)}
.s-sub{font-size:22px;font-weight:500;color:var(--muted);margin-top:12px;line-height:1.4;word-break:keep-all}
.s-head{margin-bottom:26px}
.s-head.tight{margin-bottom:18px}

/* ---------- body area ---------- */
.s-body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:18px}

/* ---------- footer insight ---------- */
.insight-wrap{margin-top:24px}
.insight{
  position:relative;
  background:linear-gradient(90deg,var(--violet-50),#fff);
  border:1.5px solid var(--violet-line);
  border-left:5px solid var(--violet);
  border-radius:16px;
  padding:20px 28px 20px 58px;
  font-size:23px;font-weight:700;color:var(--ink-2);line-height:1.4;word-break:keep-all;
  box-shadow:var(--shadow-sm);
  animation:floatSoft 5.6s ease-in-out infinite;will-change:transform;
}
.insight::before{content:"\201C";position:absolute;left:20px;top:8px;font-size:52px;line-height:1;
  color:var(--violet);opacity:.5;font-family:Georgia,serif}

/* ---------- cards ---------- */
.cards{display:grid;gap:20px}
.cards--2{grid-template-columns:repeat(2,1fr)}
.cards--3{grid-template-columns:repeat(3,1fr)}
.cards--4{grid-template-columns:repeat(2,1fr)}
.cards--6{grid-template-columns:repeat(3,1fr)}
.card{
  position:relative;background:var(--card);border:1.5px solid var(--violet-line);
  border-radius:20px;padding:26px 26px;box-shadow:var(--shadow-sm);
  display:flex;flex-direction:column;gap:9px;
}
.card--hl{background:linear-gradient(160deg,var(--violet-50),#fff);
  border-color:var(--violet);box-shadow:var(--shadow)}
.card--hl::after{content:"";position:absolute;inset:0;border-radius:20px;
  box-shadow:inset 0 0 0 1.5px var(--violet);pointer-events:none}
.card__num{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:var(--violet-100);color:var(--violet-700);font-weight:800;font-size:21px;margin-bottom:4px}
.card--hl .card__num{background:var(--violet);color:#fff}
.card__badge{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  font-weight:800;font-size:24px;color:#fff;margin-bottom:6px}
.card__icon{font-size:34px;line-height:1;margin-bottom:2px}
.card__label{font-size:15px;font-weight:800;letter-spacing:.04em;color:var(--violet);
  text-transform:uppercase}
.card__sublabel{font-size:16px;font-weight:700;color:var(--violet);letter-spacing:.02em;
  display:flex;align-items:center;gap:8px}
.card__sublabel::before,.card__sublabel::after{content:"";width:16px;height:2px;background:var(--violet-line)}
.card__title{font-size:23px;font-weight:800;color:var(--ink);line-height:1.32;word-break:keep-all}
.card--hl .card__title{color:var(--violet-800)}
.card__desc{font-size:19px;font-weight:500;color:var(--ink-2);line-height:1.5;word-break:keep-all}
.card__foot{margin-top:auto;padding-top:12px;border-top:1px dashed var(--violet-line);
  font-size:17px;color:var(--muted);line-height:1.45;word-break:keep-all}
.card__ol{margin:2px 0 0 2px;padding-left:0;list-style:none;counter-reset:c;display:flex;flex-direction:column;gap:8px}
.card__ol li{position:relative;padding-left:34px;font-size:19px;color:var(--ink-2);line-height:1.4;counter-increment:c;word-break:keep-all}
.card__ol li::before{content:counter(c);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;
  background:var(--violet-100);color:var(--violet-700);font-size:14px;font-weight:800;display:grid;place-items:center}
.card__list{list-style:none;display:flex;flex-direction:column;gap:9px;margin-top:2px}
.card__list li{position:relative;padding-left:20px;font-size:19px;color:var(--ink-2);line-height:1.4;word-break:keep-all}
.card__list li::before{content:"";position:absolute;left:2px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--violet)}
.card__chip{align-self:flex-start;margin-top:8px;background:var(--violet);color:#fff;font-weight:800;font-size:15px;
  padding:6px 14px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;letter-spacing:.02em}
.pill-top{position:absolute;top:-26px;left:50%;transform:translateX(-50%);white-space:nowrap;z-index:5;
  background:var(--violet);color:#fff;font-weight:800;font-size:15px;padding:6px 16px;border-radius:999px;
  box-shadow:var(--shadow-sm)}
.badge-star{position:absolute;top:-13px;right:20px;background:var(--violet-800);color:#fff;font-weight:800;
  font-size:14px;padding:6px 14px;border-radius:999px;letter-spacing:.03em}

/* connector line above numbered cards */
.card__num.centered{margin:0 auto 6px}
.card.center{align-items:center;text-align:center}
.card.center .card__title,.card.center .card__desc{text-align:center}

/* ---------- tags ---------- */
.tags{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:26px;justify-content:center}
.tag{background:var(--violet-100);color:var(--violet-700);font-weight:800;font-size:23px;
  padding:14px 28px;border-radius:999px;transform-origin:center;will-change:transform;
  box-shadow:0 7px 18px -10px rgba(124,58,237,.55);
  animation:tagFloat 3.4s ease-in-out infinite}
.tag:nth-child(4n)  {animation-duration:3.0s;animation-delay:-.5s}
.tag:nth-child(4n+1){animation-duration:3.9s;animation-delay:-1.4s}
.tag:nth-child(4n+2){animation-duration:3.3s;animation-delay:-2.1s}
.tag:nth-child(4n+3){animation-duration:4.3s;animation-delay:-.9s}
.tag--hl{background:var(--violet);color:#fff;box-shadow:0 9px 20px -8px rgba(124,58,237,.75)}
@keyframes tagFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-11px) scale(1.05)}}

/* ---------- table ---------- */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:20px}
.tbl thead th{font-size:18px;font-weight:800;color:var(--muted);text-align:left;
  padding:0 22px 14px;letter-spacing:.02em;border-bottom:2px solid var(--violet-line)}
.tbl tbody td{padding:16px 22px;border-bottom:1px solid #F0ECFB;color:var(--ink-2);
  font-weight:500;line-height:1.4;vertical-align:middle;word-break:keep-all}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl--firstcol tbody td:first-child{color:var(--violet-700);font-weight:800;white-space:nowrap}
.tbl .em-ico{display:inline-block;margin-right:8px}
.td--muted{color:var(--muted-2)!important;font-weight:500!important;text-decoration:line-through;
  text-decoration-color:var(--muted-2);text-decoration-thickness:1px}
.tbl tbody tr.row--hl td{background:var(--violet-50);border-bottom-color:transparent}
.tbl tbody tr.row--hl td:first-child{border-left:3px solid var(--violet);border-radius:12px 0 0 12px;color:var(--violet-700)}
.tbl tbody tr.row--hl td:last-child{border-radius:0 12px 12px 0}
.tbl tbody tr.row--hl td{color:var(--violet-800);font-weight:700}

/* ---------- two column ---------- */
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:stretch}
.twocol.with-plus{grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}
.col{background:var(--card);border:1.5px solid var(--violet-line);border-radius:20px;
  padding:26px 28px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:12px;height:100%}
.col--muted{background:var(--card-soft)}
.col--hl{background:linear-gradient(160deg,var(--violet-50),#fff);border-color:var(--violet);box-shadow:var(--shadow)}
.col__icon{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;
  background:var(--violet-100)}
.col--muted .col__icon{background:#EFEDF5}
.col--hl .col__icon{background:var(--violet);}
.col__title{font-size:24px;font-weight:800;color:var(--ink)}
.col--hl .col__title{color:var(--violet-800)}
.col__sub{font-size:17px;color:var(--muted);line-height:1.4;margin-top:-4px;word-break:keep-all}
.col__list{list-style:none;display:flex;flex-direction:column;gap:11px;margin-top:4px}
.col__list li{position:relative;padding-left:24px;font-size:20px;color:var(--ink-2);line-height:1.4;word-break:keep-all}
.col__list li::before{content:"";position:absolute;left:2px;top:10px;width:9px;height:9px;border-radius:50%;
  background:var(--violet-500)}
.col--muted .col__list li::before{background:var(--muted-2)}
.plus{width:46px;height:46px;border-radius:50%;background:var(--violet);color:#fff;font-size:26px;font-weight:800;
  display:grid;place-items:center;box-shadow:var(--shadow-sm)}
.col__steps{list-style:none;display:flex;flex-direction:column;gap:0}
.col__steps li{position:relative;padding:11px 0 11px 40px;font-size:19px;color:var(--ink-2);line-height:1.4;word-break:keep-all}
.col__steps li .em-ico{position:absolute;left:0;top:9px;font-size:22px}
.col__steps li strong{color:var(--violet-700);font-weight:800}

/* mini boxes */
.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.mini-grid.one{grid-template-columns:1fr}
.mini{background:#fff;border:1.5px solid var(--violet-line);border-radius:12px;padding:14px 16px;
  font-size:18px;font-weight:600;color:var(--ink-2);line-height:1.35;word-break:keep-all}
.col--hl .mini{background:rgba(255,255,255,.7);border-color:var(--violet-100)}

/* ---------- good / bad boxes ---------- */
.gb{display:flex;flex-direction:column;gap:16px;justify-content:center}
.gb-box{border-radius:18px;padding:22px 24px;box-shadow:var(--shadow-sm)}
.gb-box .gb-tag{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:10px;letter-spacing:.02em}
.gb-box .gb-text{font-size:20px;line-height:1.5;color:var(--ink-2);word-break:keep-all}
.gb-bad{background:var(--card-soft);border:1.5px solid #E7E3F0}
.gb-bad .gb-tag{color:var(--muted)}
.gb-good{background:linear-gradient(160deg,var(--violet-50),#fff);border:1.5px solid var(--violet)}
.gb-good .gb-tag{color:var(--violet-700)}
.gb-good .gb-text{color:var(--violet-800);font-weight:600}

/* ---------- horizontal timeline (p4) ---------- */
.htl{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:8px}
.htl-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.htl-dot{width:66px;height:66px;border-radius:50%;background:var(--violet-100);display:grid;place-items:center;
  font-size:28px;box-shadow:var(--shadow-sm)}
.htl-item.hl .htl-dot{background:var(--violet);}
.htl-name{font-size:17px;font-weight:700;color:var(--ink-2);line-height:1.3;word-break:keep-all}
.htl-item.hl .htl-name{color:var(--violet-700);font-weight:800}
.htl-arrow{align-self:center;margin-top:22px;color:var(--violet-500);font-size:24px;font-weight:800}
.now-panel{background:var(--card);border:1.5px solid var(--violet-line);border-radius:20px;overflow:hidden;
  box-shadow:var(--shadow-sm);margin-top:6px}
.now-head{background:var(--violet);color:#fff;font-size:19px;font-weight:800;padding:12px 24px;
  display:flex;align-items:center;gap:10px;letter-spacing:.02em}
.now-list{display:grid;grid-template-columns:1fr 1fr;gap:0}
.now-list li{list-style:none;padding:13px 24px;font-size:18px;color:var(--ink-2);line-height:1.4;
  border-top:1px solid #F0ECFB;word-break:keep-all;display:flex;gap:10px}
.now-list li::before{content:"▸";color:var(--violet);font-weight:800}
.now-list li:nth-child(odd){border-right:1px solid #F0ECFB}

/* ---------- wordcloud (p5) ---------- */
.wc{background:var(--card-soft);border:1.5px solid var(--violet-line);border-radius:24px;
  padding:40px 40px;display:flex;flex-wrap:wrap;gap:18px 30px;align-items:center;justify-content:center;
  box-shadow:var(--shadow-sm);min-height:340px}
.wc span{color:var(--muted);font-weight:600;line-height:1;display:inline-block;transform-origin:center;
  animation:wcPulse 3.4s ease-in-out infinite;will-change:transform}
.wc span:nth-child(5n)  {animation-duration:4.3s;animation-delay:-.4s}
.wc span:nth-child(5n+1){animation-duration:3.0s;animation-delay:-1.4s}
.wc span:nth-child(5n+2){animation-duration:3.9s;animation-delay:-2.2s}
.wc span:nth-child(5n+3){animation-duration:2.7s;animation-delay:-.9s}
.wc span:nth-child(5n+4){animation-duration:4.7s;animation-delay:-1.8s}
.wc .w-lg{font-size:40px;font-weight:800;color:var(--violet-700)}
.wc .w-md{font-size:29px;color:var(--ink-2);font-weight:700}
.wc .w-sm{font-size:21px}
.wc .w-xs{font-size:17px;color:var(--muted-2)}
@keyframes wcPulse{0%,100%{transform:scale(.82)}50%{transform:scale(1.16)}}

/* ---------- flow diagram (p11) ---------- */
.flow{display:flex;flex-direction:column;gap:14px}
.flow-row{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:stretch}
.flow-box{border-radius:18px;padding:20px 24px;box-shadow:var(--shadow-sm)}
.flow-box .fb-label{display:inline-block;font-size:15px;font-weight:800;letter-spacing:.06em;
  padding:4px 12px;border-radius:999px;margin-bottom:12px;text-transform:uppercase}
.fb-past{background:var(--card-soft);border:1.5px solid #E7E3F0}
.fb-past .fb-label{background:#EEEAF6;color:var(--muted)}
.fb-now{background:linear-gradient(160deg,var(--violet-50),#fff);border:1.5px solid var(--violet)}
.fb-now .fb-label{background:var(--violet);color:#fff}
.fb-chain{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:20px;font-weight:700;color:var(--ink-2)}
.fb-now .fb-chain{color:var(--violet-800)}
.fb-chain .arr{color:var(--violet-500);font-weight:800}
.qbox{background:var(--card);border:1.5px solid var(--violet-line);border-radius:18px;padding:20px 24px;
  box-shadow:var(--shadow-sm)}
.qbox h4{font-size:19px;font-weight:800;color:var(--violet-700);margin-bottom:12px}
.qbox ul{list-style:none;display:flex;flex-direction:column;gap:9px}
.qbox li{position:relative;padding-left:20px;font-size:18px;color:var(--ink-2);line-height:1.4;word-break:keep-all}
.qbox li::before{content:"";position:absolute;left:2px;top:10px;width:7px;height:7px;border-radius:50%;background:var(--violet)}
.flow-varrow{align-self:center;color:var(--violet-500);font-size:26px;font-weight:800;text-align:center}

/* ---------- decision flow chips (p27) ---------- */
.dflow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.dflow .node{background:var(--violet-100);color:var(--violet-700);font-weight:800;font-size:18px;
  padding:8px 16px;border-radius:12px}
.dflow .arr{color:var(--violet-500);font-weight:800;font-size:18px}

/* ---------- example box ---------- */
.example{background:var(--card-soft);border:1.5px dashed var(--violet-line);border-radius:16px;padding:18px 22px}
.example .ex-q{font-size:19px;color:var(--ink-2);line-height:1.5;font-style:italic;word-break:keep-all}
.example .ex-skills{margin-top:12px;font-size:18px;font-weight:800;color:var(--violet-700);line-height:1.5;word-break:keep-all}
.example .ex-skills b{color:var(--muted);font-weight:700;font-style:normal}

/* ---------- worksheet (p42) ---------- */
.ws{display:flex;flex-direction:column;gap:18px;margin-top:6px}
.ws-row{display:flex;align-items:center;gap:18px;background:var(--card);border:1.5px solid var(--violet-line);
  border-radius:16px;padding:20px 26px;box-shadow:var(--shadow-sm)}
.ws-row.hl{background:linear-gradient(90deg,var(--violet-50),#fff);border-color:var(--violet)}
.ws-emoji{font-size:30px}
.ws-label{font-size:22px;font-weight:800;color:var(--ink);white-space:nowrap}
.ws-row.hl .ws-label{color:var(--violet-700)}
.ws-blank{flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--violet-line) 0 14px,transparent 14px 24px)}
.ws-row.hl .ws-blank{background:repeating-linear-gradient(90deg,var(--violet) 0 14px,transparent 14px 24px)}

/* ---------- p37: regret boxes (compact) + lesson cards (impact) ---------- */
.regret-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.regret-box{display:flex;gap:14px;align-items:center;background:var(--card-soft);
  border:1.5px solid #E7E3F0;border-radius:14px;padding:14px 20px}
.rb-emoji{font-size:24px;flex:none}
.rb-title{font-size:18px;font-weight:800;color:var(--muted)}
.rb-sub{font-size:15px;color:var(--muted);line-height:1.35;word-break:keep-all}
.lessons-label{font-size:24px;font-weight:900;color:var(--violet-700);text-align:center;margin:8px 0 2px;
  letter-spacing:.01em}
.lessons{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.lesson{position:relative;border-radius:22px;padding:32px 26px;color:#fff;
  box-shadow:0 22px 44px -18px rgba(91,33,182,.65);
  display:flex;flex-direction:column;gap:14px;
  animation:lessonFloat 4s ease-in-out infinite;will-change:transform}

<script>
/* ============================ helpers ============================ */
const em = g => `<span class="em-ico">${g}</span>`;
function typoWords(text){
  return String(text).split(' ').map((w,i)=>`<span class="word" style="--wi:${i}">${w}</span>`).join(' ');
}
/* staged "key message" card — each is a click-revealed fragment */
function kCard(c){
  return `<div class="card center frag frag-card${c.hl?' card--hl':''}">
    ${c.pill?`<span class="pill-top rise">${c.pill}</span>`:''}
    <div class="card__icon k-ico">${c.icon}</div>
    ${c.sublabel?`<div class="card__sublabel">${c.sublabel}</div>`:''}
    <div class="card__title">${c.title}</div>
    ${c.foot?`<div class="card__foot">${c.foot}</div>`:''}
  </div>`;
}

function cardGrid(cols, items){
  return `<div class="cards cards--${cols}">` + items.map(c=>{
    const cls = 'card' + (c.hl?' card--hl':'') + (c.center?' center':'');
    let inner = '';
    if(c.pillTop)  inner += `<span class="pill-top">${c.pillTop}</span>`;
    if(c.starTop)  inner += `<span class="badge-star">${c.starTop}</span>`;
    if(c.badge)    inner += `<span class="card__badge" style="background:${c.badgeColor||'var(--violet)'}">${c.badge}</span>`;
    if(c.num!=null)inner += `<span class="card__num${c.center?' centered':''}">${c.num}</span>`;
    if(c.icon)     inner += `<div class="card__icon">${c.icon}</div>`;
    if(c.label)    inner += `<div class="card__label">${c.label}</div>`;
    if(c.sublabel) inner += `<div class="card__sublabel">${c.sublabel}</div>`;
    if(c.title)    inner += `<div class="card__title">${c.title}</div>`;
    if(c.desc)     inner += `<div class="card__desc">${c.desc}</div>`;
    if(c.ol)       inner += `<ol class="card__ol">${c.ol.map(x=>`<li>${x}</li>`).join('')}</ol>`;
    if(c.list)     inner += `<ul class="card__list">${c.list.map(x=>`<li>${x}</li>`).join('')}</ul>`;
    if(c.foot)     inner += `<div class="card__foot">${c.foot}</div>`;
    if(c.chip)     inner += `<span class="card__chip">${c.chip}</span>`;
    return `<div class="${cls}" data-anim>${inner}</div>`;
  }).join('') + `</div>`;
}

function table(headers, rows, opts={}){
  const {firstcol=true, hlRow=-1, mutedCol=-1} = opts;
  return `<table class="tbl${firstcol?' tbl--firstcol':''}">
    <thead><tr data-anim>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((r,ri)=>`<tr data-anim class="${ri===hlRow?'row--hl':''}">${
      r.map((c,ci)=>`<td class="${ci===mutedCol?'td--muted':''}">${c}</td>`).join('')
    }</tr>`).join('')}</tbody></table>`;
}

function colBox(c){
  const cls='col'+(c.hl?' col--hl':'')+(c.muted?' col--muted':'');
  let inner='';
  if(c.icon) inner+=`<div class="col__icon">${c.icon}</div>`;
  if(c.title) inner+=`<div class="col__title">${c.title}</div>`;
  if(c.sub) inner+=`<div class="col__sub">${c.sub}</div>`;
  if(c.list) inner+=`<ul class="col__list">${c.list.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  if(c.steps) inner+=`<ul class="col__steps">${c.steps.map(s=>`<li>${em(s.i)}<strong>${s.k}</strong> ${s.v}</li>`).join('')}</ul>`;
  if(c.miniOne) inner+=`<div class="mini-grid one">${c.miniOne.map(m=>`<div class="mini">${m}</div>`).join('')}</div>`;
  if(c.mini) inner+=`<div class="mini-grid">${c.mini.map(m=>`<div class="mini">${m}</div>`).join('')}</div>`;
  if(c.extra) inner+=c.extra;
  return `<div class="${cls}" data-anim>${inner}</div>`;
}
function twoCol(left,right,plus){
  if(plus) return `<div class="twocol with-plus">${colBox(left)}<div class="plus" data-anim>+</div>${colBox(right)}</div>`;
  return `<div class="twocol">${colBox(left)}${colBox(right)}</div>`;
}

        <li>AI 콘텐츠 제작사 제이투컴 대표</li>

/* 5 */ {part:'여는 이야기', menu:'여러분의 감각도 테크 역량이 됩니다', type:'content',

/* ============================ render ============================ */
function renderSlide(s, idx){
  const el = document.createElement('section');
  el.className = 'slide';
  el.dataset.idx = idx;

  if(s.type === 'cover'){
    el.classList.add('s-cover');
    el.innerHTML = `
      <div data-anim class="cover-title"><span class="ct-inner">취업 말고 커리어</span></div>
      <div data-anim class="cover-sub">AI 시대, 테크 업계에서 커리어 시작하기</div>
      <div data-anim class="cover-rule"></div>
      <div data-anim class="cover-name">김희정</div>
      <div data-anim class="cover-role">AI 콘텐츠 제작사 대표 · 생성형 AI 강사 · 대학 겸임교수</div>
      <div data-anim class="cover-occasion">2026 성신여자대학교 직무 멘토링 특강</div>
      <div data-anim class="cover-quote-wrap"><div class="cover-quote">"오늘은 취업 정보를 나열하는 시간이 아니라, 여러분의 커리어 선택지를 넓히는 시간입니다."</div></div>`;
    return el;
  }

  if(s.type === 'divider'){
    el.classList.add('s-divider');
    el.innerHTML = `
      <div class="ghost">${s.ghost||''}</div>
      <div data-anim class="div-kicker">${s.kicker}</div>
      <h1 data-anim class="div-title">${s.title}</h1>
      ${s.sub?`<div data-anim class="div-sub">${s.sub}</div>`:''}`;
    return el;
  }

  if(s.type === 'closing'){
    el.innerHTML = `
      <div class="closing-head">
        <div data-anim class="closing-title"><span class="ct-inner">${s.title}</span></div>
        <div data-anim class="closing-sub"><span class="cl-sub-inner">${s.sub}</span></div>
      </div>
      <div class="s-body frag frag-body">${s.body}</div>
      ${s.insight?`<div class="frag frag-insight insight-wrap"><div class="insight typo">${typoWords(s.insight)}</div></div>`:''}`;
    return el;
  }

  // default content
  el.innerHTML = `
    <div class="s-head${s.sub?'':' tight'}">
      ${s.kicker?`<div data-anim class="kicker">${s.kicker}</div>`:''}
      ${s.emoji?`<div data-anim class="s-emoji">${s.emoji}</div>`:''}
      <h1 data-anim class="s-title">${s.title}</h1>
      ${s.sub?`<div data-anim class="s-sub">${s.sub}</div>`:''}
    </div>
    <div class="s-body${s.stagedBody?'':' frag frag-body'}">${s.body||''}</div>
    ${s.insight?`<div class="frag frag-insight insight-wrap"><div class="insight typo">${typoWords(s.insight)}</div></div>`:''}`;
  return el;
}

const deck = document.getElementById('deck');
const slideEls = SLIDES.map((s,i)=>{ const el = renderSlide(s,i); deck.appendChild(el); return el; });
document.getElementById('tot').textContent = SLIDES.length;

/* ============================ navigation ============================ */
let cur = 0;
let animateBg = true; // background lines only animate on first & last slide
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const progress = document.getElementById('progress');
const curEl = document.getElementById('cur');

function stagger(container){
  container.querySelectorAll('[data-anim]').forEach((n,k)=>n.style.setProperty('--i',k));
}

/* reveal step 0 (head) of a slide, resetting all fragments. full=true reveals everything. */
function prepareSlide(el, full){
  el.querySelectorAll('.reveal').forEach(x=>x.classList.remove('reveal'));
  el.querySelectorAll('.frag').forEach(f=>f.classList.remove('is-shown','reveal'));
  el.classList.remove('reveal');
  void el.offsetWidth; // reflow so transitions replay
  el.querySelectorAll('.s-head,.closing-head').forEach(h=>{ stagger(h); h.classList.add('reveal'); });
  if(el.classList.contains('s-cover') || el.classList.contains('s-divider')){ stagger(el); el.classList.add('reveal'); }
  const frags = [...el.querySelectorAll('.frag')];
  if(full){
    frags.forEach(f=>{ stagger(f); f.classList.add('is-shown','reveal'); });
    el.dataset.step = String(frags.length);
  } else {
    el.dataset.step = '0';
  }
}

function go(n, full){
  n = Math.max(0, Math.min(SLIDES.length-1, n));
  if(n === SLIDES.length-1) full = true; // last slide always fully expanded
  cur = n;
  slideEls.forEach((el,i)=>{
    el.classList.remove('is-active','is-leaving-left');
    if(i === cur){
      prepareSlide(el, full);
      el.classList.add('is-active');
    } else if(i < cur){
      el.classList.add('is-leaving-left');
    }
  });
  updateChrome();
}

/* advance one step within the slide, or move to next slide */
function advance(){
  if(document.body.classList.contains('menu-open')) return;
  const el = slideEls[cur];
  const frags = [...el.querySelectorAll('.frag')];
  const step = +(el.dataset.step || 0);
  if(step < frags.length){
    const f = frags[step];
    stagger(f);
    f.classList.add('is-shown','reveal');
    el.dataset.step = String(step + 1);
    updateChrome();
  } else if(cur < SLIDES.length-1){
    go(cur + 1);
  }
}

/* step back within the slide, or move to previous slide (fully revealed) */
function retreat(){
  if(document.body.classList.contains('menu-open')) return;
  const el = slideEls[cur];
  const frags = [...el.querySelectorAll('.frag')];
  const step = +(el.dataset.step || 0);
  if(step > 0){
    frags[step-1].classList.remove('is-shown','reveal');
    el.dataset.step = String(step - 1);
    updateChrome();
  } else if(cur > 0){
    go(cur - 1, true);
  }
}

function updateChrome(){
  const el = slideEls[cur];
  const frags = el.querySelectorAll('.frag').length;
  const step = +(el.dataset.step || 0);
  curEl.textContent = cur + 1;
  progress.style.width = (cur/(SLIDES.length-1)*100) + '%';
  prevBtn.disabled = (cur===0 && step===0);
  nextBtn.disabled = (cur===SLIDES.length-1 && step>=frags);
  animateBg = (cur===0 || cur===SLIDES.length-1);
  updateMenuActive();
}

prevBtn.addEventListener('click',retreat);
nextBtn.addEventListener('click',advance);

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){ e.preventDefault(); advance(); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); retreat(); }
  else if(e.key==='Home'){ go(0); }
  else if(e.key==='End'){ go(SLIDES.length-1, true); }
  else if(e.key==='Escape'){ closeMenu(); }
});

/* click anywhere on the stage advances the build */
const stage=document.querySelector('.stage');
stage.addEventListener('click',()=>advance());

/* swipe */
let tx=0,ty=0;
stage.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
stage.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)){ dx<0?advance():retreat(); }
},{passive:true});

/* ============================ menu ============================ */
const menuList = document.getElementById('menuList');
let lastPart = null;
SLIDES.forEach((s,i)=>{
  if(s.part !== lastPart){
    const h = document.createElement('div');
    h.className='menu-sec'; h.textContent = s.part;
    menuList.appendChild(h); lastPart = s.part;
  }
  const b = document.createElement('button');
  b.className='menu-item'; b.dataset.idx=i;
  b.innerHTML = `<span class="mi-num">${i+1}</span><span class="mi-title">${s.menu||s.title||''}</span>`;
  b.addEventListener('click',()=>{ go(i, true); closeMenu(); });
  menuList.appendChild(b);
});
const menuItems = [...menuList.querySelectorAll('.menu-item')];
function updateMenuActive(){
  menuItems.forEach(it=>it.classList.toggle('active', +it.dataset.idx===cur));
  const active = menuItems.find(it=>+it.dataset.idx===cur);
  if(active && document.body.classList.contains('menu-open')) active.scrollIntoView({block:'nearest'});
}

const hamburger = document.getElementById('hamburger');
const scrim = document.getElementById('scrim');
function openMenu(){ document.body.classList.add('menu-open'); updateMenuActive(); }
function closeMenu(){ document.body.classList.remove('menu-open'); }
function toggleMenu(){ document.body.classList.contains('menu-open')?closeMenu():openMenu(); }
hamburger.addEventListener('click',toggleMenu);
scrim.addEventListener('click',closeMenu);

/* ============================ fit scaling ============================ */
function fit(){
  const s = Math.min(window.innerWidth/1280, window.innerHeight/905);
  deck.style.transform = `translate(-50%,-50%) scale(${s})`;
}
window.addEventListener('resize',fit);
fit();

/* ============================ animated purple lines ============================ */
const canvas = document.getElementById('bg-lines');
const ctx = canvas.getContext('2d');
let W,H,DPR;
function resizeCanvas(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);

const lines = [];
const NLINE = 7;
for(let i=0;i<NLINE;i++){
  lines.push({
    amp: 60 + Math.random()*90,
    yBase: (i+0.5)/NLINE,
    speed: 0.00016 + Math.random()*0.00020,
    phase: Math.random()*Math.PI*2,
    freq: 0.9 + Math.random()*1.3,
    width: 1 + Math.random()*1.6,
    alpha: 0.05 + Math.random()*0.07,
    drift: (Math.random()<0.5?-1:1)*(0.4+Math.random()*0.5),
  });
}
let bgT = 0, lastTs = 0;
function draw(ts){
  if(lastTs && animateBg){ bgT += (ts - lastTs); }
  lastTs = ts;
  const t = bgT;
  ctx.clearRect(0,0,W,H);
  for(const l of lines){
    ctx.beginPath();
    const yc = H*l.yBase;
    const grad = ctx.createLinearGradient(0,0,W,0);
    grad.addColorStop(0,`rgba(124,58,237,0)`);
    grad.addColorStop(0.5,`rgba(124,58,237,${l.alpha})`);
    grad.addColorStop(1,`rgba(139,92,246,0)`);
    ctx.strokeStyle = grad;
    ctx.lineWidth = l.width;
    for(let x=0;x<=W;x+=14){
      const y = yc
        + Math.sin(x/W*Math.PI*2*l.freq + t*l.speed*1000 + l.phase)*l.amp
        + Math.sin(x/W*Math.PI*4 + t*l.speed*600)*l.amp*0.25;
      x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* init */
go(0);
</script>
